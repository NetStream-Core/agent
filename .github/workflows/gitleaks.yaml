name: Gitleaks Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    name: Gitleaks detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # v3 requires a GITLEAKS_LICENSE for organization-owned repos (announced
      # breaking change); v2.3.9 is the last v2 release, which scans for
      # free without one — there is no floating "v2" tag, so this pins the
      # exact version rather than a moving major.
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

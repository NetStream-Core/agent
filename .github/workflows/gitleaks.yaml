name: Gitleaks Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    name: Gitleaks detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action enforces a GITLEAKS_LICENSE for
      # organization-owned repos regardless of which tag is pinned (checked
      # at runtime against gitleaks' own server, not shipped in a
      # particular release — confirmed: v2.3.9 fails with the exact same
      # "License key is required" error as v3). The underlying gitleaks CLI
      # itself (gitleaks/gitleaks, a different repo) has no such gate, so
      # this runs that binary directly instead of going through the vendor
      # Action wrapper.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Gitleaks Scan
        run: ./gitleaks detect --source . --no-banner -v

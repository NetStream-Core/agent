[package]
name = "network-monitor-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
common = { path = "../common" }

anyhow = "1.0.101"
aya = { version = "0.13.1", features = ["async_tokio"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
env_logger = "0.11.9"
log = "0.4.29"
pnet = "0.35.0"
prost = "0.14.3"
prost-types = "0.14.3"
regex = "1.12.3"
tokio = { version = "1.49.0", features = ["full"] }
tonic = { version = "0.14.4", features = ["transport"] }
tonic-prost = "0.14.4"
zstd = "0.13.3"
signal-hook = "0.4"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
futures-util = "0.3"

[build-dependencies]
prost-build = "0.14.3"
tonic-build = "0.14.4"
tonic-prost-build = "0.14.4"

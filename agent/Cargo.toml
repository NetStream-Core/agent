[package]
name = "network-monitor-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
common = { path = "../common" }

anyhow = "1.0.100"
aya = { version = "0.13.1", features = ["async_tokio"] }
env_logger = "0.11.8"
log = "0.4.29"
pnet = "0.35.0"
tokio = { version = "1.48.0", features = ["full"] }
signal-hook = "0.4"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
futures-util = "0.3"
axum = { version = "0.8.9", features = ["http1"] }
serde = { version = "1.0.228", features = ["derive"] }
opentelemetry = { version = "0.33.0", features = ["metrics"] }
opentelemetry_sdk = { version = "0.33.0", features = ["rt-tokio", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.33.0", features = ["metrics", "logs", "grpc-tonic"] }

[dev-dependencies]
tempfile = "3"
opentelemetry_sdk = { version = "0.33.0", features = ["testing"] }
